services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - k_vibe_node_modules:/app/node_modules
      - k_vibe_next:/app/.next
      - k_vibe_npm_cache:/root/.npm
    stdin_open: true
    tty: true

volumes:
  k_vibe_node_modules:
  k_vibe_next:
  k_vibe_npm_cache:
