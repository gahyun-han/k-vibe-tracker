name: K-Vibe Tracker CI/CD

on:
  push:
    branches:
      - main
      - hslee
  pull_request:
    branches:
      - main
      - hslee

env:
  NODE_VERSION: '18'

jobs:
  # 1️⃣ 타입 체크 및 린트
  lint-and-type-check:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run type check
        run: npm run type-check
      
      - name: Run linter
        run: npm run lint
      
      - name: Check scripts
        run: bash scripts/update-agent-guide.sh --check

  # 2️⃣ 유닛 & 통합 테스트
  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit & integration tests
        run: npm run test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        if: always()

  # 3️⃣ 빌드 검증
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Save build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-output
          path: .next/

  # 4️⃣ E2E 테스트 (선택사항 - PR에서만)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Start dev server
        run: npm run dev &
      
      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000
      
      - name: Run E2E tests
        run: npm run test:e2e
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: test-results/
        if: always()

  # 5️⃣ 성능 검사 (번들 크기)
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Analyze bundle
        run: |
          echo "🔍 Bundle Analysis Report"
          du -sh .next/
          find .next -name "*.js" -exec du -sh {} \; | sort -rh | head -20

  # 6️⃣ 배포 (main 브랜치만)
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build, unit-and-integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          production: true

  # 7️⃣ 결과 리포트
  report-results:
    name: Report CI Results
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, unit-and-integration-tests, build]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "### ✅ CI/CD Pipeline Summary"
          echo "- Type Check & Lint: ${{ needs.lint-and-type-check.result }}"
          echo "- Unit & Integration Tests: ${{ needs.unit-and-integration-tests.result }}"
          echo "- Build: ${{ needs.build.result }}"
